<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Hamzah Punjabi</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f5f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f5f1;
        color: #1c1c1a;
        font: 500 18px/1.55 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(720px, 100% - 40px);
        padding: 48px 0;
      }
      .meta {
        margin: 0;
        padding-bottom: 10px;
        border-bottom: 2px solid #1c1c1a;
        font: 500 12px 'IBM Plex Mono', ui-monospace, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #5c5c58;
      }
      h1 {
        margin: 0;
        padding: 14px 0 10px;
        font-size: clamp(56px, 12vw, 104px);
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: -0.055em;
      }
      h1 i {
        font-style: normal;
        color: #0b6e3f;
      }
      pre {
        margin: 18px 0;
        padding: 16px 18px;
        overflow-x: auto;
        background: #1c1c1a;
        color: #d6d4cc;
        font: 14px/1.6 'IBM Plex Mono', ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      pre b {
        font-weight: 400;
        color: #4ade80;
      }
      p {
        margin: 0;
      }
      a {
        color: #1c1c1a;
        text-underline-offset: 3px;
      }
      a:hover {
        color: #0b6e3f;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="meta">Error 404 · hamzahap.dev</p>
      <h1>Not here<i>.</i></h1>
      <pre><b>hamzah@hap-os ~ $</b> cd <span class="path">/that-page</span>
bash: cd: <span class="path">/that-page</span>: No such file or directory</pre>
      <p>
        Whatever was here moved, or never existed. Try the <a href="/">homepage</a>, or the
        <a href="/terminal/">terminal</a> if you would rather type.
      </p>
    </main>
    <script>
      // textContent, never innerHTML: the path is whatever the visitor typed.
      var path = location.pathname
      try {
        path = decodeURIComponent(path)
      } catch (e) {
        /* malformed escape: show it as typed */
      }
      document.querySelectorAll('.path').forEach(function (el) {
        el.textContent = path
      })
    </script>
  </body>
</html>
